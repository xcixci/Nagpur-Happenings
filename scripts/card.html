<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f9edd2; color-scheme: only light; }
  .card {
    position: relative; display: grid; grid-template-columns: 630px 1fr;
    width: 1200px; height: 630px; background: #f9edd2; color: #0e451c;
    font-family: Mukta, "Segoe UI", sans-serif;
  }
  .visual { position: relative; overflow: hidden; background: #0e451c; }
  .visual__img { position: absolute; inset: 0; display: none; width: 100%; height: 100%; margin: 0; object-fit: contain; object-position: center; }
  .visual--poster .visual__img, .visual--logo .visual__img { display: block; }
  .visual__tile { display: none; }
  .visual--tile .visual__tile {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;
    margin: 0; padding: 48px 64px; text-align: center; text-wrap: balance;
    font: 600 52px/1.12 Eczar, Georgia, serif; color: #f9edd2;
  }
  .badge {
    position: absolute; left: 30px; bottom: 30px; margin: 0; padding: 13px 24px 11px;
    border-radius: 999px; font: 700 26px/1 Mukta, sans-serif;
  }
  .badge[hidden] { display: none; }
  .badge--free { background: #ddf0d6; color: #1f5a2a; }
  .badge--paid { background: #fff; color: #0e451c; box-shadow: inset 0 0 0 2px #d6bf8e; }
  .info { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 50px 56px 40px 54px; }
  .info::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px; background: #0e451c; }
  .brand { display: flex; align-items: center; gap: 12px; margin: 0; font: 600 30px/1.1 Eczar, Georgia, serif; }
  .brand .milestone { width: 28px; flex: none; }
  .milestone__body { fill: #fffaf0; stroke: #0e451c; stroke-width: 2.5; stroke-linejoin: round; }
  .milestone__cap { fill: #0e451c; stroke: #0e451c; stroke-width: 2.5; stroke-linejoin: round; }
  .milestone__zero { font-family: Eczar, Georgia, serif; font-size: 21px; font-weight: 600; fill: #0e451c; }
  .milestone__dot { fill: #f16e03; }
  .kicker { margin: 34px 0 0; font: 700 20px/1.2 Mukta, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #35693d; }
  .title {
    margin: 12px 0 0; font: 600 60px/1.1 Eczar, Georgia, serif; letter-spacing: -.01em; text-wrap: balance;
    overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4;
  }
  .when { margin: 22px 0 0; font: 500 30px/1.25 Mukta, sans-serif; }
  .where, .by { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; }
  .where { margin: 6px 0 0; font: 400 27px/1.3 Mukta, sans-serif; color: #44604c; -webkit-line-clamp: 2; }
  .by { margin: 4px 0 0; font: 400 24px/1.3 Mukta, sans-serif; color: #44604c; -webkit-line-clamp: 1; }
  .url { margin: auto 0 0; padding-top: 18px; font: 700 23px/1 Mukta, sans-serif; color: #44604c; }
  [hidden] { display: none !important; }
  .card--cancelled .kicker { color: #9f2d2d; }
  .card--cancelled .title { text-decoration: line-through; text-decoration-thickness: 3px; }
  .card--quiet, .card--quiet .info { background: #1e1c1a; color: #f2ebe1; }
  .card--quiet .info::before, .card--quiet .badge, .card--quiet .by { display: none !important; }
  .card--quiet .kicker { display: none !important; }
  .card--quiet.card--cancelled .kicker { display: block !important; color: #e7bdb8; }
  .card--quiet .brand { color: #ada498; font-size: 26px; }
  .card--quiet .milestone__body { fill: #1e1c1a; stroke: #ada498; }
  .card--quiet .milestone__cap, .card--quiet .milestone__zero { fill: #ada498; stroke: #ada498; }
  .card--quiet .milestone__dot { display: none; }
  .card--quiet .title { margin-top: auto; }
  .card--quiet .where, .card--quiet .url { color: #bdb4a9; }
  .card--quiet .url { font-weight: 500; }
  .card--quiet .visual { background: #2a2725; }
  .card--quiet .visual--tile .visual__tile { color: #cfc6bb; }
</style>
</head>
<body>
<div id="card" class="card">
  <div id="visual" class="visual">
    <img id="img" class="visual__img" alt="">
    <p id="tile" class="visual__tile"></p>
    <p id="badge" class="badge" hidden></p>
  </div>
  <div id="info" class="info">
    <p class="brand">
      <svg class="milestone" viewBox="0 0 40 52" aria-hidden="true">
        <path class="milestone__body" d="M4 51V20a16 16 0 0 1 32 0v31z"/>
        <path class="milestone__cap" d="M4 21v-1a16 16 0 0 1 32 0v1z"/>
        <text class="milestone__zero" x="20" y="45" text-anchor="middle">0</text>
        <circle class="milestone__dot" cx="37" cy="7" r="3.2"/>
      </svg>
      <span id="brand-name"></span>
    </p>
    <p id="kicker" class="kicker"></p>
    <h1 id="title" class="title"></h1>
    <p id="when" class="when"></p>
    <p id="where" class="where"></p>
    <p id="by" class="by"></p>
    <p id="domain" class="url"></p>
  </div>
</div>
<script>
  function loadInto(img, src, ms) {
    return new Promise((resolve) => {
      if (!src) return resolve(false);
      const done = (ok) => { clearTimeout(timer); img.onload = img.onerror = null; resolve(ok); };
      const timer = setTimeout(() => done(false), ms);
      img.onload = () => done(img.naturalWidth > 0);
      img.onerror = () => done(false);
      img.src = src;
    });
  }

  function fit(el, max, min, slackRatio) {
    for (let size = max; size >= min; size -= 2) {
      el.style.fontSize = size + 'px';
      const slack = Math.ceil(size * slackRatio);
      if (el.scrollHeight <= el.clientHeight + slack) break;
    }
  }

  globalThis.renderCard = async function (d) {
    const $ = (id) => document.getElementById(id);
    const card = $('card');
    const visual = $('visual');
    const img = $('img');
    card.className = 'card' + (d.quiet ? ' card--quiet' : '') + (d.cancelled ? ' card--cancelled' : '');
    $('brand-name').textContent = d.brand || '';
    $('domain').textContent = d.domain || '';
    $('kicker').textContent = d.kicker || '';
    $('title').textContent = d.title || '';
    $('when').textContent = d.when || '';
    $('where').textContent = d.where || '';
    $('where').hidden = !d.where;
    $('by').textContent = d.by ? 'by ' + d.by : '';
    $('by').hidden = !d.by;
    $('tile').textContent = d.tile || '';
    const badge = $('badge');
    badge.textContent = d.badge || '';
    badge.className = 'badge' + (d.badgeKind ? ' badge--' + d.badgeKind : '');
    badge.hidden = !d.badge;

    img.removeAttribute('src');
    let mode = d.image ? d.imageKind : 'tile';
    visual.className = 'visual visual--' + mode;
    if (d.image) {
      const ok = await loadInto(img, d.image, 20000);
      if (!ok) {
        mode = 'tile';
        visual.className = 'visual visual--tile';
      }
    }

    await document.fonts.ready;
    const title = $('title');
    const info = $('info');
    title.style.fontSize = '';
    for (let size = 60; size >= 36; size -= 2) {
      title.style.fontSize = size + 'px';
      const slack = Math.ceil(size * 0.35);
      if (title.scrollHeight <= title.clientHeight + slack && info.scrollHeight <= info.clientHeight + 1) break;
    }
    if (mode === 'tile') fit($('tile'), 52, 32, 0.2);
    return mode;
  };
</script>
</body>
</html>
