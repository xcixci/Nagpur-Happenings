# Builds and publishes the site, with a link-preview page and card for each event.
# Runs on every push, every hour (to pick up new events from the Sheet), and from the
# "Run workflow" button on the Actions tab.
# Needs Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (renders cards with the Chrome already on the runner)
        run: npm install --prefix tools/previews --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build site and event previews
        run: node tools/previews/build.mjs
        env:
          PW_CHANNEL: chrome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
