<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nagpur Happenings</title>
<script>
  // A share link for an event whose preview page isn't built yet (/e/NH-021/) goes to the event on
  // the calendar; any other unknown address goes to the calendar.
  (function () {
    var m = location.pathname.match(/\/e\/([A-Za-z0-9_-]{1,40})\/?(?:index\.html)?$/);
    location.replace('/' + (m ? '#event=' + encodeURIComponent(m[1]) : ''));
  })();
</script>
</head><body style="font-family:system-ui,sans-serif;padding:2rem">
<p><a href="/">Go to Nagpur Happenings</a></p>
</body></html>
