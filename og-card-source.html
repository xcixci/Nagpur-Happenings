<!doctype html>
<!-- Source for assets/og-card.png (the link preview image). Not used by the live site.
     To remake the PNG: open this file at 1200 x 630 and take a screenshot. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; background: var(--paper); color: var(--ink); box-sizing: border-box; padding: 100px 96px 0; }
  .card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 18px; background: var(--ink); }
  .row { display: flex; align-items: flex-start; gap: 40px; }
  .card .milestone { width: 104px; margin-top: 6px; }
  .card .milestone__body, .card .milestone__cap { stroke-width: 2.2; }
  h1 { font: 600 108px/.98 var(--serif); letter-spacing: -0.02em; margin: 0; }
  .road { margin: 40px 0 0 144px; height: 0; border-top: 4px dashed var(--line-strong); width: 860px; }
  .lede { font: 400 42px/1.2 var(--serif); margin: 30px 0 0 144px; }
  .meta { font: 500 28px/1.35 var(--sans); color: var(--moss); margin: 14px 0 0 144px; max-width: 820px; }
</style></head>
<body><div class="card">
  <div class="row">
    <svg class="milestone" viewBox="0 0 40 52" aria-hidden="true">
      <path class="milestone__body" d="M4 51V20a16 16 0 0 1 32 0v31z"/>
      <path class="milestone__cap" d="M4 21v-1a16 16 0 0 1 32 0v1z"/>
      <text class="milestone__zero" x="20" y="45" text-anchor="middle">0</text>
      <circle class="milestone__dot" cx="37" cy="7" r="3.2"/>
    </svg>
    <h1>Nagpur<br>Happenings</h1>
  </div>
  <div class="road"></div>
  <p class="lede">Discover what's happening in Nagpur.</p>
  <p class="meta">Book clubs, board games, open mics, workshops, walks and more, on one calendar.</p>
</div></body></html>
